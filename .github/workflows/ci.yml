name: ci

# The Git Crafter CI standard (SoulCraft-Org/git-crafter templates/ci/README.md): this repo calls Git Crafter's
# reusable workflow, which runs each job on GitHub's standard hosted runners, free in a public repository.
# Dependabot's github-actions entry bumps the pin. short runs the text and catalog checks; standard runs the
# full-history gitleaks scan.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@dd03762898c5cbd816b7a093307c643dcc80a5c3 # v4.0.0
    with:
      node-version: "26"
      short: |
        python3 -I tools/checks.py --self-test
        python3 -I tools/checks.py
        python3 -I tools/catalog.py --self-test
        python3 -I tools/catalog.py --check
        node --test tests/site.test.mjs
      standard: bash tools/secret_scan.sh
