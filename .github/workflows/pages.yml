name: pages

# The Credits Explorer: site/ plus catalog/plans.json, published to GitHub Pages. A pull request builds the same
# artifact and keeps it for a week; only a push to main deploys. Action pins match Compute Crafter's pages.yml.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "catalog/plans.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The page fetches plans.json from its own folder, so a catalog pull request updates the site with no page edit.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp catalog/plans.json _site/plans.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: pages-preview
          path: _site
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
